[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credifast"
version = "0.1.0"
description = "Explainable credit-risk decision support for the Cognizant NPN Hackathon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary hackathon prototype" }
authors = [{ name = "CrediFast Team" }]
dependencies = []

[project.optional-dependencies]
data = [
  "kaggle>=1.7,<2",
]
api = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]
ui = [
  "streamlit>=1.39,<2",
]
ml = [
  "catboost>=1.2,<2",
  "duckdb>=1.1,<2",
  "lightgbm>=4.5,<5",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "polars>=1.12,<2",
  "pyarrow>=17,<25",
  "scikit-learn>=1.5,<2",
  "shap>=0.46,<1",
]
dev = [
  "httpx>=0.27,<1",
  "ipykernel>=6.29,<8",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=8.3,<9",
  "ruff>=0.7,<1",
]

[project.scripts]
credifast = "credifast.cli:main"
credifast-data = "credifast.data_cli:main"
credifast-train = "credifast.model_cli:main"
credifast-score = "credifast.score_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
